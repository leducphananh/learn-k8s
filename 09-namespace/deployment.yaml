apiVersion: apps/v1
kind: Deployment

metadata:
  name: web
  namespace: dev
  labels:
    app: nginx
    env: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx
      env: dev

  template:
    metadata:
      labels:
        app: nginx
        env: dev

    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
