apiVersion: apps/v1
kind: Deployment
metadata:
  name: echotts-deployment
  labels:
    app: echotts-studio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echotts-studio
  template:
    metadata:
      labels:
        app: echotts-studio
    spec:
      containers:
      - name: echotts-studio
        image: echotts-studio:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PORT
          value: "8000"
        - name: MAX_UPLOAD_SIZE_MB
          value: "10"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
